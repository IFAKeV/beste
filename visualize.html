<!doctype html>
<meta charset="utf-8">
<title>SharePoint-Struktur – Visualisierung</title>
<style>
  body{font:14px system-ui,Segoe UI,Roboto,Arial,sans-serif;margin:20px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
  .card{border:1px solid #ddd;border-radius:12px;padding:12px}
  .title{font-weight:600;margin-bottom:4px}
  .url{font-size:12px;color:#555;margin-bottom:8px;word-break:break-all}
  .tag{display:inline-block;background:#eef;padding:2px 8px;border-radius:999px;font-size:12px;margin-right:6px}
  ul{margin:0px 0 0 0px}
  input[type="search"]{padding:6px 8px;border:1px solid #ccc;border-radius:8px;min-width:280px}
  .muted{color:#666;font-size:12px}
</style>
<div class="grid" id="grid"></div>
<script>
// CSV-Text in Objekte umwandeln
function parseCSV(text){
  const lines = text.replace(/\r/g,'').split('\n').filter(l=>l.trim().length); // Zeilen bereinigen
  const head = lines.shift().split(','); // Erste Zeile: Spaltennamen
  return lines.map(l=>{
    // Naiver Split, ausreichend weil Folders/Owners keine Kommata enthalten
    const cols = l.split(',');
    const obj = {};
    head.forEach((h,i)=>obj[h.trim()] = (cols[i]||'').trim());
    return obj;
  });
}

// Karten rendern und optional nach Suchbegriff filtern
function render(rows, q=''){
  const grid = document.getElementById('grid');
  grid.innerHTML='';
  const needle = q.toLowerCase();

  rows.forEach(r=>{
    const folders = (r.Folders||'').split('|').map(s=>s.trim()).filter(Boolean); // Ordnerliste
    const hay = (r.SiteUrl+' '+r.Title+' '+folders.join(' ')).toLowerCase();
    if(needle && !hay.includes(needle)) return; // Filter anwenden

    const card = document.createElement('div'); card.className='card';
    const title = document.createElement('div'); title.className='title'; title.textContent = r.Title || '(ohne Titel)';
    const url = document.createElement('div'); url.className='url'; url.textContent = r.SiteUrl || '';
    const meta = document.createElement('div');
/*
    meta.innerHTML = `
      <span class="tag">${r.Template||'STS#3'}</span>
      <span class="tag">${r.StorageGB||'Default'} GB</span>
      <span class="tag">${(r.Owners||'').split('|').length} Owner</span>
      <span class="tag">${folders.length} Ordner</span>
    `;
*/
    const ul = document.createElement('ul');

    // Eine zusätzliche Hierarchieebene für Ordner erlauben
    const tree = {};
    folders.forEach(p=>{
      const m = p.match(/^([^\[]+)(?:\[([^\]]*)\])?/); // Root und optionale Subordner
      if(!m) return;
      const root = m[1].trim();
      const subs = (m[2]||'').split(';').map(s=>s.trim()).filter(Boolean);
      if(!root) return;
      if(!tree[root]) tree[root] = new Set();
      subs.forEach(s=>tree[root].add(s));
    });

    Object.entries(tree).forEach(([root, subs])=>{
      const li = document.createElement('li');
      li.textContent = root;
      if(subs.size){
        const subUl = document.createElement('ul');
        subs.forEach(s=>{
          const subLi = document.createElement('li');
          subLi.textContent = s;
          subUl.appendChild(subLi);
        });
        li.appendChild(subUl);
      }
      ul.appendChild(li);
    });

    card.append(title,url,meta,ul);
    grid.appendChild(card); // Karte in Grid einsetzen
  });
}

let data=[]; // Globale Datenbasis
const fileInput = document.getElementById('file'); // Optionales Datei-Upload-Feld
const searchInput = document.getElementById('q'); // Optionales Suchfeld

// CSV-Datei aus Dateiupload laden
if(fileInput){
  fileInput.addEventListener('change', async (e)=>{
    const f = e.target.files[0];
    if(!f) return;
    const text = await f.text();
    data = parseCSV(text);
    render(data, searchInput ? searchInput.value : '');
  });
}

// Live-Suche über die bereits geladenen Daten
if(searchInput){
  searchInput.addEventListener('input', (e)=>render(data, e.target.value));
}

// Automatisch vorhandene departments.csv laden
async function loadDefaultCSV(){
  try{
    // Cache-Busting: immer aktuelle CSV laden
    const url = `departments.csv?cachebust=${Date.now()}`;
    const resp = await fetch(url, {cache: 'no-store'});
    if(resp.ok){
      const text = await resp.text();
      data = parseCSV(text);
      render(data, searchInput ? searchInput.value : '');
    }
  }catch(err){
    console.warn('departments.csv konnte nicht geladen werden', err);
  }
}
loadDefaultCSV();
</script>
